<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FOOD QR 접속 QR코드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    background:#eef1f6;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card {
    background:#fff;
    width:100%; max-width:380px;
    border-radius:20px;
    box-shadow:0 18px 40px rgba(13,52,128,.12);
    overflow:hidden;
  }
  .card-head {
    background:linear-gradient(135deg,#1a4fa0 0%,#0d3480 100%);
    color:#fff;
    padding:22px 24px 20px;
  }
  .card-head .eyebrow { font-size:11px; letter-spacing:.06em; opacity:.75; font-weight:700; }
  .card-head h1 { font-size:19px; margin-top:4px; font-weight:800; }
  .card-body { padding:26px 24px 24px; }

  .qr-wrap {
    display:flex; align-items:center; justify-content:center;
    background:#f6f8fb; border:1px solid #e6eaf1;
    border-radius:16px; padding:20px;
  }
  #qrcode { line-height:0; }
  #qrcode img { border-radius:6px; }

  .status-pill {
    margin-top:16px;
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700; color:#e65100;
    background:#fff3e0; border-radius:8px; padding:7px 10px;
  }
  .status-pill.live { color:#16a34a; background:#e6f9ee; }

  label { display:block; font-size:11.5px; font-weight:700; color:#66738a; margin:18px 0 6px; }
  .url-row { display:flex; gap:8px; }
  input[type=text] {
    flex:1; border:1.5px solid #dde3ec; border-radius:10px;
    padding:10px 12px; font-size:13px; color:#222; outline:none;
    font-family:inherit;
  }
  input[type=text]:focus { border-color:#1a4fa0; }
  button {
    border:none; border-radius:10px; cursor:pointer; font-weight:700;
    font-family:inherit; font-size:12.5px;
  }
  .btn-apply {
    background:#1a4fa0; color:#fff; padding:0 16px;
  }
  .btn-apply:hover { background:#0d3480; }

  .actions { display:flex; gap:8px; margin-top:16px; }
  .actions button {
    flex:1; padding:11px 0;
  }
  .btn-download { background:#111827; color:#fff; }
  .btn-download:hover { background:#000; }
  .btn-copy { background:#f1f2f4; color:#333; }
  .btn-copy:hover { background:#e6e8eb; }

  .hint {
    margin-top:16px; font-size:11px; color:#98a2b3; line-height:1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-head">
    <div class="eyebrow">HAITAI · FOOD QR</div>
    <h1>제품 QR코드</h1>
  </div>

  <div class="card-body">
    <div class="qr-wrap"><div id="qrcode"></div></div>

    <div class="status-pill" id="statusPill">⚠ 임시 URL — 실제 배포 주소로 교체 필요</div>

    <label for="urlInput">스캔 시 이동할 주소</label>
    <div class="url-row">
      <input type="text" id="urlInput" value="https://tf01844-droid.github.io/ht/">
      <button class="btn-apply" onclick="regenerate()">적용</button>
    </div>

    <div class="actions">
      <button class="btn-download" onclick="downloadPng()">PNG 다운로드</button>
      <button class="btn-copy" onclick="copyUrl()">주소 복사</button>
    </div>

    <div class="hint">
      실제 페이지를 호스팅한 뒤 그 주소를 위 입력창에 붙여넣고 "적용"을 누르면 QR이 그 주소로 다시 생성됩니다.
    </div>
  </div>
</div>

<script>
let qr = null;

function regenerate() {
  const url = document.getElementById('urlInput').value.trim();
  const wrap = document.getElementById('qrcode');
  wrap.innerHTML = '';
  qr = new QRCode(wrap, {
    text: url || ' ',
    width: 220,
    height: 220,
    colorDark: '#0d3480',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  const pill = document.getElementById('statusPill');
  const isPlaceholder = url.includes('foodqr.haitai.com/homrunball-demo');
  if (isPlaceholder) {
    pill.textContent = '⚠ 임시 URL — 실제 배포 주소로 교체 필요';
    pill.classList.remove('live');
  } else {
    pill.textContent = '✓ 적용된 주소로 QR 생성됨';
    pill.classList.add('live');
  }
}

function downloadPng() {
  const canvas = document.querySelector('#qrcode canvas');
  if (!canvas) return;
  const link = document.createElement('a');
  link.download = 'foodqr_homrunball.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function copyUrl() {
  const input = document.getElementById('urlInput');
  input.select();
  input.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
  } catch(e) {}
  if (navigator.clipboard) {
    navigator.clipboard.writeText(input.value).catch(()=>{});
  }
}

window.addEventListener('DOMContentLoaded', regenerate);
</script>

</body>
</html>
